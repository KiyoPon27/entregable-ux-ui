# 1. Configuración del Servidor
server.port=8081

# Tamaño máximo de archivos para imágenes base64 (20MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# 2. Conexión a Base de Datos MySQL (LT_Sanchez)
spring.datasource.url=jdbc:mysql://localhost:3306/LT_Sanchez?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=LTSanchez123
# LTSanchez123
# alonso123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Configuración de JPA / Hibernate
# "none" es CRÍTICO porque tú ya creaste las tablas a mano. 
# Si pones "update", Java intentará modificar tus tablas y podría dañar tus triggers.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de batch para optimizar queries
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# 4. Configuracion de correo SMTP Gmail
# Usa una cuenta de Google/Gmail o Google Workspace con App Password.
# Coloca aqui el correo que enviara los mensajes y su password de aplicacion.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=itsanchezadm@gmail.com
